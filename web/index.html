<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harmonized MODIS + VIIRS burning activity calendar for Greece and Argentina, 2000-2025." />
    <title>Burning Calendar</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <a class="skip" href="#panel">Skip to the region panel</a>
    <header>
      <div class="brand">
        <h1>Burning Calendar</h1>
        <p class="tagline">MODIS + VIIRS active fires, harmonized, 2000-2025</p>
      </div>
      <div class="toggle" id="country" role="group" aria-label="Country">
        <button type="button" data-country="gr" aria-pressed="true">Greece</button>
        <button type="button" data-country="ar" aria-pressed="false">Argentina</button>
      </div>
    </header>
    <main>
      <div id="map"></div>
      <section id="area" aria-label="Area of interest">
        <div class="field">
          <label for="region">Region</label>
          <select id="region"></select>
        </div>
        <form id="latlon-form" class="field latlon">
          <label for="latlon">Or find a point (lat, lon)</label>
          <div class="inline">
            <input id="latlon" type="text" inputmode="decimal" placeholder="40.64, 22.94" autocomplete="off" aria-describedby="latlon-msg" />
            <button type="submit" class="btn">Find</button>
          </div>
          <span id="latlon-msg" class="field-msg" role="status"></span>
        </form>
      </section>
      <section id="panel" tabindex="-1"><p class="hint">Loading...</p></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
