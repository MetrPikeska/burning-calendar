<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harmonized MODIS + VIIRS burning activity calendar for Greece and Argentina, 2000-2025." />
    <title>Burning Calendar</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header>
      <h1>Burning Calendar</h1>
      <span class="muted">MODIS + VIIRS active fires, harmonized, 2000-2025</span>
      <label>Country
        <select id="country">
          <option value="gr">Greece</option>
          <option value="ar">Argentina</option>
        </select>
      </label>
    </header>
    <main>
      <div id="map"></div>
      <section id="area" aria-label="Area of interest">
        <label>Region <select id="region"></select></label>
        <form id="latlon-form" class="latlon">
          <label>Lat, lon <input id="latlon" type="text" inputmode="decimal" placeholder="40.64, 22.94" autocomplete="off" /></label>
          <button type="submit">Find</button>
          <span id="latlon-msg" class="muted" role="status"></span>
        </form>
      </section>
      <section id="panel"><p class="hint">Loading...</p></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
