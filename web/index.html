<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harmonized MODIS + VIIRS burning activity calendar for Greece and Argentina, 2000-2026." />
    <title>Burning Calendar</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <a class="skip" href="#panel">Skip to the region panel</a>
    <header>
      <div class="brand">
        <h1>Burning Calendar</h1>
        <p class="tagline">MODIS + VIIRS active fires, harmonized, 2000-2026</p>
      </div>
      <div class="toggle" id="country" role="group" aria-label="Country">
        <button type="button" data-country="gr" aria-pressed="true">Greece</button>
        <button type="button" data-country="ar" aria-pressed="false">Argentina</button>
      </div>
      <div id="area" role="group" aria-label="Area of interest">
        <label for="region" class="sr-only">Region</label>
        <select id="region"></select>
        <details class="latlon" id="latlon-details">
          <summary class="btn">Find a point</summary>
          <form id="latlon-form" class="latlon-pop">
            <label for="latlon">Latitude, longitude in decimal degrees</label>
            <div class="inline">
              <input id="latlon" type="text" inputmode="decimal" placeholder="40.64, 22.94" autocomplete="off" aria-describedby="latlon-msg" />
              <button type="submit" class="btn">Find</button>
            </div>
            <span id="latlon-msg" class="field-msg" role="status"></span>
          </form>
        </details>
      </div>
      <button type="button" class="btn" id="ai-open"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>Use with AI</button>
    </header>
    <main>
      <div id="map"></div>
      <section id="panel" tabindex="-1"><p class="hint">Loading...</p></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
