[project]
name = "burning-calendar"
version = "0.1.0"
description = "Harmonized MODIS + VIIRS burning activity calendar (NASA Space Apps 2026)"
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.7",
    "geopandas>=1.2.0",
    "netcdf4>=1.7.5.1.post1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "referencing>=0.37.0",
]
