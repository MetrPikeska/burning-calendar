<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/data.js"></script>
    <script src="assets/fires.js"></script>
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        src: url("assets/fonts/IBMPlexSans-Variable.woff2") format("woff2");
        font-weight: 100 700;
        font-style: normal;
      }
      :root {
        --ground: #faf8f5;
        --ink: #1d1b19;
        --muted: #615a53;
        --rule: #e2dbd2;
        --jump: #f57d15;
        --harm: #6a176e;
        --anomaly: #1565b5;
        --font-display: "IBM Plex Sans", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div
        id="chart"
        data-composition-id="chart"
        data-composition-src="compositions/chart.html"
        data-start="0"
        data-duration="11"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="fires"
        data-composition-id="fires"
        data-composition-src="compositions/fires.html"
        data-start="11"
        data-duration="2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="app"
        data-composition-id="app"
        data-composition-src="compositions/app.html"
        data-start="13"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="mcp"
        data-composition-id="mcp"
        data-composition-src="compositions/mcp.html"
        data-start="20"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="numbers"
        data-composition-id="numbers"
        data-composition-src="compositions/numbers.html"
        data-start="24.5"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="27"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
