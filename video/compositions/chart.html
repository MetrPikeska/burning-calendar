<template>
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("assets/fonts/IBMPlexSans-Variable.woff2") format("woff2");
      font-weight: 100 700;
      font-style: normal;
    }
    #root {
      position: absolute;
      inset: 0;
      font-family: "IBM Plex Sans", sans-serif;
      color: #1d1b19;
      font-variant-numeric: tabular-nums;
    }
    #chart-stage {
      position: absolute;
      inset: 0;
    }
    #chart-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #chart-svg text {
      font-family: "IBM Plex Sans", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .chart-header {
      position: absolute;
      left: 120px;
      top: 64px;
      font-size: 28px;
      font-weight: 500;
      color: #615a53;
      letter-spacing: 0;
    }
    .chart-header b {
      color: #1d1b19;
      font-weight: 650;
    }
    .chart-line {
      position: absolute;
      left: 120px;
      top: 128px;
      width: 1680px;
      font-size: 84px;
      font-weight: 650;
      letter-spacing: -0.015em;
      line-height: 1.05;
    }
    .chart-sub {
      display: block;
      margin-top: 18px;
      font-size: 36px;
      font-weight: 450;
      color: #615a53;
      letter-spacing: 0;
    }
    #chart-a-sub,
    #chart-q,
    #chart-a,
    #chart-h {
      opacity: 0;
    }
    .chart-harm {
      color: #6a176e;
      font-size: 64px;
    }
    .chart-jump {
      color: #b8500a;
    }
  </style>
  <div id="root" data-composition-id="chart" data-width="1920" data-height="1080">
    <div id="chart-stage">
      <svg id="chart-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
        <defs>
          <clipPath id="chart-band-clip"><rect id="chart-band-cliprect" x="0" y="0" width="0" height="1080" /></clipPath>
        </defs>
        <g id="chart-grid"></g>
        <g id="chart-xaxis"></g>
        <path id="chart-band" fill="#6a176e" fill-opacity="0" clip-path="url(#chart-band-clip)" />
        <line id="chart-marker" stroke="#f57d15" stroke-width="3" stroke-dasharray="10 8" opacity="0" />
        <text id="chart-marker-label" fill="#b8500a" font-size="30" font-weight="600" opacity="0">2012: MODIS (1 km) → VIIRS (375 m)</text>
        <path id="chart-modis" fill="none" stroke="#1d1b19" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
        <path id="chart-jumpseg" fill="none" stroke="#f57d15" stroke-width="8" stroke-linecap="round" />
        <path id="chart-viirs" fill="none" stroke="#1d1b19" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
        <path id="chart-harmline" fill="none" stroke="#6a176e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
        <text id="chart-ytitle" x="200" y="352" fill="#615a53" font-size="30" font-weight="500">Active fire detections per year, Greece (NASA FIRMS)</text>
        <text id="chart-modis-label" fill="#615a53" font-size="28" font-weight="500" opacity="0">raw MODIS</text>
      </svg>
    </div>

    <div id="chart-header-clip" class="clip" data-start="0" data-duration="11" data-track-index="2">
      <div id="chart-header" class="chart-header">
        NASA Space Apps 2026 · <b>Harmonization of MODIS and VIIRS Hot Spots</b> · Team Spearow
      </div>
    </div>

    <div id="chart-q-clip" class="clip" data-start="3.1" data-duration="2.4" data-track-index="3">
      <div id="chart-q" class="chart-line">Did fires in Greece <span class="chart-jump" id="chart-q-word">triple</span> in 2012?</div>
    </div>

    <div id="chart-a-clip" class="clip" data-start="5.4" data-duration="2.3" data-track-index="3">
      <div id="chart-a" class="chart-line">
        No. The satellite changed.
        <span class="chart-sub" id="chart-a-sub">VIIRS sees <b id="chart-ratio">3.5</b>× more detections of the same fires than MODIS.</span>
      </div>
    </div>

    <div id="chart-h-clip" class="clip" data-start="8" data-duration="3" data-track-index="3">
      <div id="chart-h" class="chart-line chart-harm">
        Harmonized: MODIS years back-cast onto the VIIRS scale
        <span class="chart-sub">with an error range for every modelled month. The jump is gone.</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const D = window.BC_DATA.greece;
      const rows = D.annual.filter((r) => r.year >= 2003);
      const X0 = 200, X1 = 1760, YB = 940, YT = 400;
      const n = rows.length - 1;
      const iJump = rows.findIndex((r) => r.year === 2012); // index of first VIIRS year
      const xOf = (i) => X0 + ((X1 - X0) * i) / n;
      const S = { ymax: 10500, u: 0, h: 0, band: 0, modisGrey: 0, jumpOp: 1, marker: 0, scaleB: 0 };
      const yOf = (v) => YB - ((YB - YT) * v) / S.ymax;

      // Copy computed from data.js
      const jump = D.jump_2011_2012.viirs_2012 / D.jump_2011_2012.modis_2011;
      const words = { 2: "double", 3: "triple", 4: "quadruple" };
      document.getElementById("chart-q-word").textContent = words[Math.round(jump)] || Math.round(jump) + "×";
      document.getElementById("chart-ratio").textContent = D.viirs_over_modis_2012_2019.toFixed(1);

      const NS = "http://www.w3.org/2000/svg";
      function el(tag, attrs, text) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text != null) e.textContent = text;
        return e;
      }
      // x axis (static)
      const xa = document.getElementById("chart-xaxis");
      xa.appendChild(el("line", { x1: X0, x2: X1, y1: YB, y2: YB, stroke: "#c5bbb0", "stroke-width": 2 }));
      rows.forEach((r, i) => {
        if ((r.year - 2003) % 4 === 0 || r.year === 2025) {
          xa.appendChild(el("text", { x: xOf(i), y: YB + 46, "text-anchor": "middle", fill: "#615a53", "font-size": 30 }, String(r.year)));
        }
      });

      const gridG = document.getElementById("chart-grid");
      const TICKS = [];
      [["A", [2500, 5000, 7500, 10000]], ["B", [10000, 20000, 30000]]].forEach(([set, vals]) => {
        vals.forEach((v) => {
          const line = el("line", { x1: X0, x2: X1, stroke: "#e2dbd2", "stroke-width": 2 });
          const text = el("text", { x: X0 - 18, "text-anchor": "end", fill: "#615a53", "font-size": 28 }, v / 1000 + "k");
          gridG.appendChild(line); gridG.appendChild(text);
          TICKS.push({ set, v, line, text });
        });
      });
      gridG.appendChild(el("text", { x: X0 - 18, y: YB + 10, "text-anchor": "end", fill: "#615a53", "font-size": 28 }, "0"));
      function partial(key, from, to, u) {
        // points from index `from` to `to`, drawn up to global progress u (in segments)
        if (u <= from) return "";
        const pts = [];
        for (let i = from; i <= to; i++) {
          if (i <= u) pts.push([xOf(i), yOf(rows[i][key])]);
          else {
            const f = u - (i - 1);
            const a = rows[i - 1][key], b = rows[i][key];
            pts.push([xOf(i - 1 + f), yOf(a + (b - a) * f)]);
            break;
          }
        }
        return "M" + pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L");
      }
      function naiveVal(i) {
        return rows[i].naive;
      }
      function render() {
        // grid: two fixed tick sets, cross-faded during the rescale
        const fade = Math.min(1, Math.max(0, (S.ymax - 10500) / (30000 - 10500)));
        TICKS.forEach((t) => {
          const y = yOf(t.v);
          const op = t.set === "A" ? 1 - fade : fade;
          const vis = y >= YT - 40 && y <= YB + 1 ? op : 0;
          t.line.setAttribute("y1", y); t.line.setAttribute("y2", y); t.line.setAttribute("opacity", vis);
          t.text.setAttribute("y", y + 10); t.text.setAttribute("opacity", vis);
        });
        // raw stitched series: MODIS part, jump segment, VIIRS part
        const pm = [];
        for (let i = 0; i < iJump; i++) {
          if (i <= S.u) pm.push([xOf(i), yOf(naiveVal(i))]);
        }
        if (S.u < iJump - 1 && S.u > 0) {
          const k = Math.floor(S.u), f = S.u - k;
          pm.push([xOf(k + f), yOf(naiveVal(k) + (naiveVal(k + 1) - naiveVal(k)) * f)]);
        }
        const toD = (pts) => (pts.length ? "M" + pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") : "");
        const modis = document.getElementById("chart-modis");
        modis.setAttribute("d", toD(pm));
        modis.setAttribute("stroke", S.modisGrey > 0.5 ? "#a59c92" : "#1d1b19");
        modis.setAttribute("opacity", 1 - 0.45 * S.modisGrey);
        modis.setAttribute("stroke-dasharray", S.modisGrey > 0.5 ? "4 12" : "none");
        // jump segment between iJump-1 and iJump
        const js = document.getElementById("chart-jumpseg");
        if (S.u > iJump - 1) {
          const f = Math.min(1, S.u - (iJump - 1));
          const a = naiveVal(iJump - 1), b = naiveVal(iJump);
          js.setAttribute("d", toD([[xOf(iJump - 1), yOf(a)], [xOf(iJump - 1 + f), yOf(a + (b - a) * f)]]));
        } else js.setAttribute("d", "");
        js.setAttribute("opacity", S.jumpOp);
        // VIIRS part
        const pv = [];
        for (let i = iJump; i <= n; i++) {
          if (i <= S.u) pv.push([xOf(i), yOf(naiveVal(i))]);
        }
        if (S.u > iJump && S.u < n) {
          const k = Math.floor(S.u), f = S.u - k;
          pv.push([xOf(k + f), yOf(naiveVal(k) + (naiveVal(k + 1) - naiveVal(k)) * f)]);
        }
        document.getElementById("chart-viirs").setAttribute("d", toD(pv));
        // harmonized 2003 -> 2012 (joins the observed VIIRS year)
        document.getElementById("chart-harmline").setAttribute("d", partial("harm", 0, iJump, S.h));
        // band (static polygon, revealed by a clip rect that follows h)
        const top = [], bot = [];
        for (let i = 0; i < iJump; i++) {
          top.push([xOf(i), yOf(rows[i].harm_hi)]);
          bot.unshift([xOf(i), yOf(rows[i].harm_lo)]);
        }
        top.push([xOf(iJump), yOf(rows[iJump].harm)]);
        document.getElementById("chart-band").setAttribute("d", toD(top.concat(bot)) + "Z");
        document.getElementById("chart-band").setAttribute("fill-opacity", S.band);
        document.getElementById("chart-band-cliprect").setAttribute("width", xOf(Math.min(S.h, n)));
        // 2012 marker
        const xm = xOf(iJump);
        const mk = document.getElementById("chart-marker");
        mk.setAttribute("x1", xm); mk.setAttribute("x2", xm);
        mk.setAttribute("y1", YT - 10); mk.setAttribute("y2", YB);
        mk.setAttribute("opacity", S.marker);
        const ml = document.getElementById("chart-marker-label");
        ml.setAttribute("x", xm + 16); ml.setAttribute("y", YT + 20);
        ml.setAttribute("opacity", S.marker);
        const lab = document.getElementById("chart-modis-label");
        lab.setAttribute("x", xOf(3)); lab.setAttribute("y", yOf(naiveVal(3)) - 22);
        lab.setAttribute("opacity", S.modisGrey);
      }

      const tl = gsap.timeline({ paused: true, onUpdate: render, defaults: { immediateRender: false } });
      // raw stitched record draws, pauses before 2012, steps up, continues
      tl.fromTo(S, { u: 2 }, { u: iJump - 1, duration: 1.3, ease: "none", immediateRender: true }, 0);
      tl.fromTo(S, { u: iJump - 1 }, { u: iJump, duration: 0.3, ease: "power2.in" }, 1.6);
      tl.fromTo(S, { marker: 0 }, { marker: 1, duration: 0.25, ease: "power2.out" }, 1.9);
      tl.fromTo(S, { u: iJump }, { u: n, duration: 1.1, ease: "none" }, 1.9);
      // lines of text (baselines first)
      tl.fromTo("#chart-q", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.1);
      tl.fromTo("#chart-q", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power3.in" }, 5.3);
      tl.fromTo("#chart-a", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 5.4);
      tl.fromTo("#chart-a-sub", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.9);
      tl.fromTo("#chart-a", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power3.in" }, 7.5);
      // rescale, grey the raw MODIS years, draw the harmonized line and band
      tl.fromTo(S, { ymax: 10500 }, { ymax: 30000, duration: 0.8, ease: "power2.inOut" }, 7.6);
      tl.fromTo(S, { jumpOp: 1, marker: 1 }, { jumpOp: 0, marker: 0.35, duration: 0.4, ease: "power2.out" }, 8.1);
      tl.fromTo(S, { modisGrey: 0 }, { modisGrey: 1, duration: 0.4, ease: "power2.out" }, 8.1);
      tl.fromTo(S, { h: 0 }, { h: iJump, duration: 1.6, ease: "none" }, 8.3);
      tl.fromTo(S, { band: 0 }, { band: 0.16, duration: 0.6, ease: "power2.out" }, 8.3);
      tl.fromTo("#chart-h", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 8);
      tl.fromTo("#chart-stage", { opacity: 1 }, { opacity: 0.0, duration: 0.2, ease: "power3.in" }, 10.78);
      tl.fromTo("#chart-h", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power3.in" }, 10.78);
      render();
      window.__timelines["chart"] = tl;
    })();
  </script>
</template>
